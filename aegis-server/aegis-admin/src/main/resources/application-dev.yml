# 开发环境配置：数据源凭据支持环境变量覆盖，
# 命令行临时换密码不用改文件：AEGIS_DB_PASSWORD=xxx mvn spring-boot:run
spring:
  datasource:
    url: jdbc:mysql://${AEGIS_DB_HOST:localhost}:${AEGIS_DB_PORT:3306}/aegis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${AEGIS_DB_USER:aegis}
    password: ${AEGIS_DB_PASSWORD:aegis123}
    # dev 库连接池收紧到 5：本机单进程自用，默认 10 个连接纯属浪费
    hikari:
      maximum-pool-size: 5

# 开发期把 SQL 打到控制台：学习阶段看得见每条语句，MyBatis-Plus 在跑什么心里有数
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.aegis: debug
