# workspace 定义 + catalog 统一依赖版本（方案文档 2.1.4 / 2.4.3）
# 所有应用通过 "catalog:" 引用版本，升级依赖只改这一处
packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  vue: ^3.5.13
  vue-router: ^4.5.0
  pinia: ^2.3.0
  vite: ^6.0.7
  '@vitejs/plugin-vue': ^5.2.1
  typescript: ~5.6.3
  vue-tsc: ^2.2.0
  '@types/node': ^22.10.0
  ant-design-vue: 4.2.6
  unplugin-vue-components: ^32.1.0
  vue-i18n: ^11.4.10
